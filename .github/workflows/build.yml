name: build

# Build only on request:
#   - add the `build` label to a PR (removing it stops re-builds)
#   - or run this workflow manually from the Actions tab (pick a host)
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to build
        type: choice
        options: [all, acrux, antares, canopus]
        default: all
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build')
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: acrux
            runner: ubuntu-latest
          - host: antares
            runner: ubuntu-24.04-arm
          - host: canopus
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Should build ${{ matrix.host }}?
        id: select
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ inputs.host }}" ] && [ "${{ inputs.host }}" != "all" ] && [ "${{ inputs.host }}" != "${{ matrix.host }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.select.outputs.build == 'true'

      - name: Free runner disk space
        if: steps.select.outputs.build == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: nixbuild/nix-quick-install-action@v35
        if: steps.select.outputs.build == 'true'

      - name: Restore and save Nix cache
        if: steps.select.outputs.build == 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: build-${{ matrix.host }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: build-${{ matrix.host }}-
          gc-max-store-size-linux: 6G

      - name: Build nixosConfigurations.${{ matrix.host }}
        if: steps.select.outputs.build == 'true'
        run: nix build --no-update-lock-file --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: Closure size
        if: steps.select.outputs.build == 'true'
        run: nix path-info -Sh ./result
