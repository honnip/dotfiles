name: Flake Eval Check

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  NIX_CONFIG: "allow-import-from-derivation = false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: Caches the inputs
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ hashFiles('**/flake.lock') }}
          restore-prefixes-first-match: nix-store-
      - name: Check lockfile sanity
        run: nix flake metadata --no-update-lock-file
      - name: Flake eval check
        run: nix flake check --no-update-lock-file --keep-going --no-build

